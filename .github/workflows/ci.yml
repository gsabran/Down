name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Select Xcode 27.1
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Build Swift package
        run: swift build

      - name: Lint CocoaPods specification
        run: |
          set +e
          pod lib lint Down.podspec --allow-warnings --no-clean --verbose > "$RUNNER_TEMP/pod-lint.log" 2>&1
          lint_status=$?
          grep -E 'ERROR|error:|warning:|did not pass validation|Linting using|PODS_ROOT|SWIFT_INCLUDE_PATHS|libcmark' "$RUNNER_TEMP/pod-lint.log" | tail -80 || true
          exit "$lint_status"

      - name: Inspect CocoaPods lint paths on failure
        if: failure()
        run: |
          python3 - <<'PY'
          import glob
          import os
          import re

          log_path = os.path.join(os.environ["RUNNER_TEMP"], "pod-lint.log")
          with open(log_path, encoding="utf-8") as log_file:
              roots = sorted(set(re.findall(r"/var/folders/[^\s\\]+/CocoaPods-Lint-[^/\s\\]+", log_file.read())))

          for root in roots:
              print(f"LINT_ROOT {root}")
              for config in glob.glob(os.path.join(root, "Pods/Target Support Files/Pods-App/*.xcconfig")):
                  print(f"XCCONFIG {config}")
                  with open(config, encoding="utf-8") as config_file:
                      for line in config_file:
                          if "PODS_ROOT" in line or "SWIFT_INCLUDE_PATHS" in line:
                              print(line.rstrip())
              for candidate in ("Pods/Down/libcmark/include/module.modulemap", "libcmark/include/module.modulemap"):
                  path = os.path.join(root, candidate)
                  print(f"MODULEMAP_EXISTS {path} {os.path.exists(path)}")
          PY

      - name: Build example app
        run: |
          xcodebuild \
            -project Down-Example/Down-Example.xcodeproj \
            -scheme Down-Example \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Run Xcode unit tests
        run: |
          simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; devices = json.load(sys.stdin)["devices"].get("com.apple.CoreSimulator.SimRuntime.iOS-27-1", []); print(next((device["udid"] for device in devices if device.get("isAvailable")), ""))')"
          test -n "$simulator_id"
          xcodebuild \
            -project Down.xcodeproj \
            -scheme Down \
            -destination "platform=iOS Simulator,id=$simulator_id" \
            -enableCodeCoverage YES \
            CODE_SIGNING_ALLOWED=NO \
            test
