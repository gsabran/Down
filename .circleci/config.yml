version: 2.1

jobs:
  test:
    macos:
      xcode: "27.1.0"
    steps:
      - checkout
      - run:
          name: Show toolchain versions
          command: |
            xcodebuild -version
            swift --version
      - run:
          name: Build Swift package
          command: swift build
      - run:
          name: Build example app
          command: |
            xcodebuild \
              -project Down-Example/Down-Example.xcodeproj \
              -scheme Down-Example \
              -destination 'generic/platform=iOS Simulator' \
              CODE_SIGNING_ALLOWED=NO \
              build
      - run:
          name: Run Xcode unit tests
          command: |
            simulator_id="$(xcrun simctl list devices available --json | python3 -c 'import json, sys; data = json.load(sys.stdin); devices = [(tuple(map(int, runtime.split("iOS-")[-1].split("-"))), device["udid"]) for runtime, entries in data["devices"].items() if runtime.startswith("com.apple.CoreSimulator.SimRuntime.iOS-") for device in entries if device.get("isAvailable")]; print(max(devices)[1] if devices else "")')"
            test -n "$simulator_id"
            xcodebuild \
              -project Down.xcodeproj \
              -scheme Down \
              -destination "platform=iOS Simulator,id=$simulator_id" \
              -enableCodeCoverage YES \
              CODE_SIGNING_ALLOWED=NO \
              test

workflows:
  build-and-test:
    jobs:
      - test
